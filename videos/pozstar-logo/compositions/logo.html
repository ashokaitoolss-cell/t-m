      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const letters = gsap.utils.toArray("#word .letter");
          const boxes = letters.map((p) => p.getBBox());
          // The word's slot is the gap between the bars and the "P"; it slides out from behind it.
          const slot = Math.min(...boxes.map((b) => b.x)) - 0.4;
          const wordRight = Math.max(...boxes.map((b) => b.x + b.width));
          document.getElementById("wordSlotEdge").setAttribute("x", slot);

          // 1. The three bars shoot out of their slot, top to bottom, stretched by speed.
          gsap.utils.toArray("#bars .bar").forEach((bar, i) => {
            const w = bar.getBBox().width;
            tl.fromTo(
              bar,
              { x: -(w * 1.35) - 0.5, scaleX: 1.35, transformOrigin: "0% 50%" },
              { x: 0, scaleX: 1, transformOrigin: "0% 50%", duration: 0.6, ease: "expo.out" },
              0.2 + i * 0.09,
            );
          });

          // 2. "PozStar" slides out of its slot; the last letter leads, so the letters arrive
          //    a little spread and close up into the word.
          tl.fromTo(
            letters,
            { x: -(wordRight - slot) - 0.3 },
            { x: 0, duration: 1.1, ease: "power4.out", stagger: { each: 0.035, from: "end" } },
            0.62,
          );

          // 3. The tagline fades up, glyph by glyph.
          tl.fromTo("#tagline .glyph", { opacity: 0, y: 1.1 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", stagger: 0.014 }, 1.55);

          // 4. A slow breath of push-in to the end.
          tl.fromTo("#push", { scale: 1 }, { scale: 1.015, duration: 4.8 - 1.9, ease: "sine.inOut" }, 1.9);

          window.__timelines["logo"] = tl;
          tl.seek(0);
        })();
      </script>
