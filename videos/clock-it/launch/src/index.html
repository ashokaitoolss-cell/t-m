<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./assets/vendor/three.module.js" } }
    </script>
    <style>
      @font-face { font-family: "Instrument Sans"; font-weight: 500; src: url("assets/fonts/InstrumentSans-500.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 400; src: url("assets/fonts/Inter-400.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 500; src: url("assets/fonts/Inter-500.woff2") format("woff2"); }
      :root {
        --paper: #f3efe6; --charcoal: #242521; --olive: #596047; --brass: #ac9167; --oxide: #913f3b;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
      .layer { position: absolute; inset: 0; width: 1920px; height: 1080px; }

      /* Paper: warm base, soft vignette, a drifting pool of window light. */
      #paper { background: radial-gradient(ellipse 120% 100% at 50% 45%, #f6f2ea 0%, #f3efe6 55%, #e9e3d7 100%); }
      #pool { position: absolute; left: 50%; top: 45%; width: 1800px; height: 1300px; margin: -650px 0 0 -900px;
        background: radial-gradient(closest-side, rgba(255, 252, 245, 0.85), rgba(255, 252, 245, 0) 100%); will-change: transform; }

      /* Olive stage: a circle whose edge the 3D layer keeps glued to the dial. */
      #olive { --r: 0px; --cx: 960px; --cy: 540px; clip-path: circle(var(--r) at var(--cx) var(--cy)); opacity: 0;
        background: radial-gradient(ellipse 110% 95% at 50% 50%, #5d6449 0%, #596047 45%, #454b37 100%); }
      #olive-pool { position: absolute; left: 50%; top: 50%; width: 1500px; height: 1100px; margin: -550px 0 0 -750px;
        background: radial-gradient(closest-side, rgba(214, 205, 170, 0.34), rgba(214, 205, 170, 0) 100%); will-change: transform; }
      .bokeh { position: absolute; border-radius: 50%; filter: blur(28px);
        background: radial-gradient(circle at 35% 35%, rgba(236, 226, 196, 0.26), rgba(172, 145, 103, 0.08) 70%, rgba(172, 145, 103, 0)); }

      #gl { display: block; width: 1920px; height: 1080px; }

      /* Type */
      .line { position: absolute; left: 0; top: 0; white-space: nowrap; font-family: "Instrument Sans", sans-serif; font-weight: 500;
        color: var(--charcoal); letter-spacing: -0.012em; font-size: 84px; line-height: 1; }
      .word { position: absolute; top: 0; display: inline-block; will-change: transform, opacity, filter; }
      .on-olive { color: var(--paper); }
      #tagline, #smallprint { font-family: "Inter", sans-serif; font-weight: 400; letter-spacing: 0; }
      #dot { position: absolute; left: 0; top: 0; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
        background: var(--oxide); will-change: transform, opacity; }
      #bang { position: absolute; width: 11px; height: 62px; border-radius: 3px; background: var(--charcoal); }
      svg { position: absolute; inset: 0; overflow: visible; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="38.4" data-width="1920" data-height="1080" data-fps="60">
      <div id="bg" class="layer clip" data-start="0" data-duration="38.4" data-track-index="0">
        <div id="paper" class="layer"></div>
        <div id="pool"></div>
        <div id="olive" class="layer">
          <div id="olive-pool"></div>
          <div class="bokeh" id="bk1" style="left:-120px;top:620px;width:520px;height:520px"></div>
          <div class="bokeh" id="bk2" style="left:1540px;top:-180px;width:460px;height:460px"></div>
          <div class="bokeh" id="bk3" style="left:1480px;top:760px;width:300px;height:300px"></div>
        </div>
      </div>

      <canvas id="gl" data-layout-allow-overflow class="layer clip" data-start="0" data-duration="38.4" data-track-index="1" width="1920" height="1080"></canvas>

      <div id="fx" class="layer clip" data-start="0" data-duration="38.4" data-track-index="2">
        <svg width="1920" height="1080" viewBox="0 0 1920 1080">
          <g id="grid" stroke="#596047" stroke-opacity="0.34" stroke-width="2" fill="none">
            <line id="gh1" x1="-40" y1="0" x2="1960" y2="0" />
            <line id="gh2" x1="-40" y1="0" x2="1960" y2="0" />
            <line id="gv1" x1="0" y1="-40" x2="0" y2="1120" />
            <line id="gv2" x1="0" y1="-40" x2="0" y2="1120" />
          </g>
          <g id="rings" fill="none" stroke-width="2"></g>
          <g id="particles" fill="none" stroke-width="2.2" stroke-linejoin="round"></g>
        </svg>
      </div>

      <div id="type" class="layer clip" data-start="0" data-duration="38.4" data-track-index="3">
        <div id="l1" class="line"></div>
        <div id="flankL" class="line"></div>
        <div id="flankR" class="line"></div>
        <div id="why" class="line on-olive"></div>
        <div id="mark" class="line" style="font-size:150px;letter-spacing:-0.02em"></div>
        <div id="bang"></div>
        <div id="tagline" class="line" style="font-size:40px"></div>
        <div id="slot" data-layout-allow-overlap data-layout-allow-occlusion class="line" style="font-size:96px"></div>
        <div id="smallprint" class="line" style="font-size:30px;color:#6b6a62"></div>
        <div id="dot"></div>
      </div>

      <!-- audio -->
    </div>

    <script type="module" src="assets/scene.js"></script>
    <script src="assets/timeline.js"></script>
  </body>
</html>
