<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #gradient-canvas {
          position: absolute;
          inset: 0;
          display: block;
          width: 1920px;
          height: 1080px;
        }
      </style>
      <div id="root" data-composition-id="gradient" data-width="1920" data-height="1080">
        <canvas id="gradient-canvas" width="1920" height="1080"></canvas>
      </div>
      <script>
        // Eleven V4 — the living gradient. The supplied gradient (logo painted out, assets/plate.png)
        // drawn through one fragment shader as a pure function of film time: light streams in along
        // the streaks out of the dark, the streaks keep sliding against each other for the whole piece,
        // and the pill's press sends one ring of light through the field. HyperFrames dispatches
        // `hf-seek` per frame; we draw exactly that time.
        (function () {
          const W = 1920, H = 1080;
          const PULSE_AT = 3.12; // keep in step with PRESS + 0.1 in lockup.html
          const PILL = [1213, 543]; // pill centre (final layout)

          const canvas = document.getElementById("gradient-canvas");
          const gl = canvas.getContext("webgl", { alpha: false, antialias: false, preserveDrawingBuffer: true, premultipliedAlpha: false });

          const vert = `
            attribute vec2 aPos;
            varying vec2 vUv;
            void main() { vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;

          const frag = `
            precision highp float;
            varying vec2 vUv;
            uniform sampler2D uTex;
            uniform vec2 uRes;
            uniform float uTime, uFrame;
            uniform float uZoom, uRot;      // camera settle
            uniform float uPan;             // slow drift along the streaks
            uniform float uAmp;             // streak flow strength
            uniform float uGlow;            // light travelling along the streaks
            uniform float uBlur;            // long-exposure smear along the streaks (intro)
            uniform float uFront;           // where the light has reached along the streaks
            uniform vec2 uPulseC;
            uniform float uPulseR, uPulseA; // press ring

            const vec3 DARK = vec3(0.016, 0.035, 0.027);
            const vec2 S = vec2(0.8192, -0.5736);  // streak direction (rising 35 deg to the right, y down)
            const vec2 N = vec2(0.5736, 0.8192);   // across the streaks

            float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
            float noise(vec2 p) {
              vec2 i = floor(p), f = fract(p);
              vec2 u = f * f * (3.0 - 2.0 * f);
              return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
            }
            // A displaced sample that wanders off the plate is eased back inside it: C1-continuous,
            // so the frame edge never shows a mirrored seam or a clamped smear.
            float soft(float x, float hi) {
              const float E = 28.0;
              if (x < E) return E * exp(x / E - 1.0);
              if (x > hi - E) return hi - E * exp((hi - E - x) / E);
              return x;
            }
            vec3 plate(vec2 p) {
              return texture2D(uTex, vec2(soft(p.x, uRes.x), soft(p.y, uRes.y)) / uRes).rgb;
            }

            void main() {
              vec2 P = vec2(vUv.x, 1.0 - vUv.y) * uRes;   // pixels, y down
              vec2 q = P - 0.5 * uRes;
              float u = dot(q, S), v = dot(q, N);

              // Camera: a slow settle in scale and roll about the frame centre.
              float c = cos(uRot), s = sin(uRot);
              vec2 cam = mat2(c, -s, s, c) * q / uZoom;

              // Broad bands of streaks slide along their length and sway a little across it. Kept
              // low-frequency so the fanned streaks at the bottom stay straight instead of kinking.
              float f1 = noise(vec2(v * 0.0025, uTime * 0.25)) - 0.5;
              float du = uAmp * f1 * 220.0;
              float dv = uAmp * 10.0 * sin(u * 0.0025 + uTime * 0.7 + f1 * 4.0);
              vec2 src = 0.5 * uRes + cam - S * uPan + S * du + N * dv;

              vec3 col;
              if (uBlur > 0.002) {
                col = vec3(0.0);
                float len = uBlur * 520.0;
                for (int i = 0; i < 20; i++) {
                  float k = float(i) / 19.0 - 0.5;
                  col += plate(src + S * k * len);
                }
                col /= 20.0;
              } else {
                col = plate(src);
              }

              // Light arrives along the streaks from the lower left, each streak at its own pace,
              // with a faint hot edge where it is arriving.
              float lag = (noise(vec2(v * 0.006, 4.0)) - 0.5) * 340.0;
              float x = u + lag - uFront;
              float lit = 1.0 - smoothstep(-520.0, 380.0, x);
              float edge = exp(-pow(x / 260.0, 2.0)) * (1.0 - smoothstep(0.85, 1.0, lit));
              col = mix(DARK, col * (1.0 + 0.55 * edge), lit);

              // Soft bands of light run up the streaks, each streak a little out of phase.
              float ph = u * 0.0045 - uTime * 1.1 + 6.2832 * noise(vec2(v * 0.0045, 9.0));
              col *= 1.0 + uGlow * 0.065 * sin(ph);

              // The press: one soft ring of light out from the pill.
              float d = length(P - uPulseC);
              col *= 1.0 + uPulseA * 0.2 * exp(-pow((d - uPulseR) / 210.0, 2.0));

              // Fine grain keeps the gradient from banding in the encode.
              col += (hash(P + fract(uFrame * 0.6180339) * 917.0) - 0.5) * (2.2 / 255.0);
              gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
            }`;

          function shader(type, src) {
            const sh = gl.createShader(type);
            gl.shaderSource(sh, src);
            gl.compileShader(sh);
            if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
            return sh;
          }
          const prog = gl.createProgram();
          gl.attachShader(prog, shader(gl.VERTEX_SHADER, vert));
          gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, frag));
          gl.linkProgram(prog);
          gl.useProgram(prog);
          const buf = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, buf);
          gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
          const aPos = gl.getAttribLocation(prog, "aPos");
          gl.enableVertexAttribArray(aPos);
          gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
          const U = {};
          ["uTex", "uRes", "uTime", "uFrame", "uZoom", "uRot", "uPan", "uAmp", "uGlow", "uBlur", "uFront", "uPulseC", "uPulseR", "uPulseA"].forEach((n) => (U[n] = gl.getUniformLocation(prog, n)));
          gl.viewport(0, 0, W, H);
          gl.uniform2f(U.uRes, W, H);
          gl.uniform2f(U.uPulseC, PILL[0], PILL[1]);
          gl.uniform1i(U.uTex, 0);

          const clamp01 = (x) => Math.min(1, Math.max(0, x));
          const span = (t, a, b) => clamp01((t - a) / (b - a));
          const ease = (name) => gsap.parseEase(name);
          const out3 = ease("power3.out"), inOut2 = ease("power2.inOut"), expoOut = ease("expo.out"), out2 = ease("power2.out");

          // Every envelope is a function of t alone, so any frame can be drawn in any order.
          function params(t) {
            return {
              front: -1900 + 4300 * out2(span(t, 0.1, 2.4)),
              blur: 1 - inOut2(span(t, 0.1, 2.7)),
              amp: 0.6 + 0.4 * (1 - out2(span(t, 0, 3.6))),
              zoom: 1.07 + 0.09 * Math.exp(-t / 1.5) + 0.02 * (1 - t / 6.5),
              pan: 10 * (t - 6.5),
              glow: inOut2(span(t, 1.2, 3.2)),
              rot: -0.035 * Math.exp(-t / 1.7),
              pulseR: 2400 * expoOut(span(t, PULSE_AT, PULSE_AT + 2.0)),
              pulseA: t < PULSE_AT ? 0 : Math.pow(1 - span(t, PULSE_AT, PULSE_AT + 2.0), 1.6),
            };
          }

          let ready = false, last = -1;
          function draw(t) {
            if (!ready) return;
            const p = params(t);
            gl.uniform1f(U.uTime, t);
            gl.uniform1f(U.uFrame, Math.round(t * 60));
            gl.uniform1f(U.uZoom, p.zoom);
            gl.uniform1f(U.uRot, p.rot);
            gl.uniform1f(U.uPan, p.pan);
            gl.uniform1f(U.uAmp, p.amp);
            gl.uniform1f(U.uGlow, p.glow);
            gl.uniform1f(U.uBlur, p.blur);
            gl.uniform1f(U.uFront, p.front);
            gl.uniform1f(U.uPulseR, p.pulseR);
            gl.uniform1f(U.uPulseA, p.pulseA);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            last = t;
          }

          const loaded = new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
              const tex = gl.createTexture();
              gl.activeTexture(gl.TEXTURE0);
              gl.bindTexture(gl.TEXTURE_2D, tex);
              gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
              gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
              gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
              gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
              gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
              gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
              ready = true;
              draw(window.__hfThreeTime || 0);
              resolve();
            };
            img.onerror = () => reject(new Error("plate.png failed to load"));
            img.src = "assets/plate.png";
          });

          window.__hf = window.__hf || {};
          window.__hf.buildReady = window.__hf.buildReady || {};
          window.__hf.buildReady["eleven-gradient"] = loaded;
          window.addEventListener("hf-seek", (e) => draw(e.detail.time));
          window.__renderAt = (t) => loaded.then(() => draw(t));

          // Studio scrubbing and playback drive this timeline; its clock tween redraws the frame.
          const TOTAL = 6.5;
          const tl = gsap.timeline({ paused: true });
          const clock = { t: 0 };
          tl.fromTo(clock, { t: 0 }, { t: TOTAL, duration: TOTAL, ease: "none", immediateRender: false,
            onUpdate: () => { if (tl.time() !== last) draw(tl.time()); } }, 0);
          window.__timelines["gradient"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
