      <script>
        // Eleven V4 — the lockup. One paused GSAP timeline: a text caret blinks, "Eleven" streams in
        // behind it, the caret stretches into the V4 pill while the word slides over to make room,
        // V4 rises inside the pill, and one press-and-ripple lands it. The gradient
        // (gradient.html) draws from the same film time.
        (function () {
          const PRESS = 3.02; // the press; gradient.html sends its ring of light at PRESS + 0.1
          const SHIFT = 135; // the word alone sits centred; the lockup's final x is 0
          const PILL = { left: 1091, top: 469, w: 244, h: 148, border: 12 };
          const CARET = { w: 8, h: 128, border: 4 };
          const caretTop = (PILL.h - CARET.h) / 2;
          const at = (x) => x - PILL.left; // frame x -> #press-local x

          // Caret stops: before the E, then in the gap after each letter (glyph right edges + gaps).
          const word = ["E", "l", "e1", "v", "e2", "n"].map((n) => document.getElementById("g-" + n));
          const stops = [585, 672, 703, 791, 874, 961, 1048];
          const TYPE = 1.3, STEP = 0.085;

          const tl = gsap.timeline({ paused: true });
          const pill = "#pill";

          // Opening state, applied now. Every later change is a fromTo whose "from" is this same state,
          // so seeking back to any earlier time (t = 0 included) lands on it exactly.
          gsap.set("#lockup", { x: SHIFT });
          gsap.set(pill, { x: at(stops[0]), y: caretTop, width: CARET.w, height: CARET.h, borderWidth: CARET.border, opacity: 0 });
          gsap.set(word, { opacity: 0, x: -14, filter: "blur(10px)" });
          gsap.set(["#g-V", "#g-4"], { y: 120 });
          gsap.set(["#press", "#ripple"], { scale: 1, transformOrigin: "50% 50%" });
          gsap.set("#ripple", { opacity: 0 });

          // The caret wakes up and blinks once.
          tl.fromTo(pill, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power1.out", immediateRender: false }, 0.55);
          tl.fromTo(pill, { opacity: 1 }, { opacity: 0, duration: 0.07, ease: "power1.in", immediateRender: false }, 0.98);
          tl.fromTo(pill, { opacity: 0 }, { opacity: 1, duration: 0.07, ease: "power1.out", immediateRender: false }, 1.16);

          // "Eleven" streams in: each letter sharpens out of a blur as the caret steps past it.
          word.forEach((g, i) => {
            const t = TYPE + i * STEP;
            tl.fromTo(g, { opacity: 0, x: -14, filter: "blur(10px)" },
              { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out", immediateRender: false }, t);
            tl.fromTo(pill, { x: at(stops[i]) }, { x: at(stops[i + 1]), duration: 0.09, ease: "power2.out", immediateRender: false }, t);
          });

          // The caret becomes the pill: it first fills out into a solid capsule at the pill's height,
          // then opens into the ring while the word slides left to make room for it.
          const SEED = 1.95, SD = 0.17, SEED_W = 2 * PILL.border;
          const seedX = at(stops[6]); // grows to the right, away from the n
          tl.fromTo(pill,
            { x: at(stops[6]), y: caretTop, width: CARET.w, height: CARET.h, borderWidth: CARET.border },
            { x: seedX, y: 0, width: SEED_W, height: PILL.h, borderWidth: PILL.border, duration: SD, ease: "power2.inOut", immediateRender: false }, SEED);
          const OPEN = SEED + SD, OD = 0.72, oEase = "power4.inOut";
          tl.fromTo(pill, { x: seedX, width: SEED_W }, { x: 0, width: PILL.w, duration: OD, ease: oEase, immediateRender: false }, OPEN);
          tl.fromTo("#lockup", { x: SHIFT }, { x: 0, duration: OD, ease: oEase, immediateRender: false }, OPEN);
          // The capsule stays solid as it starts to widen, then dissolves into the outline, so the ring
          // never shows a hairline slit while it is still narrow.
          tl.fromTo(pill, { backgroundColor: "rgba(255, 255, 255, 1)" },
            { backgroundColor: "rgba(255, 255, 255, 0)", duration: 0.3, ease: "power1.inOut", immediateRender: false }, OPEN + 0.04);

          // V4 rises inside the pill.
          tl.fromTo("#g-V", { y: 120 }, { y: 0, duration: 0.7, ease: "expo.out", immediateRender: false }, 2.5);
          tl.fromTo("#g-4", { y: 120 }, { y: 0, duration: 0.7, ease: "expo.out", immediateRender: false }, 2.58);

          // One press, one ripple.
          tl.fromTo("#press", { scale: 1 }, { scale: 0.955, duration: 0.1, ease: "power2.in", immediateRender: false }, PRESS);
          tl.fromTo("#press", { scale: 0.955 }, { scale: 1, duration: 0.6, ease: "back.out(3)", immediateRender: false }, PRESS + 0.1);
          tl.fromTo("#ripple", { scale: 1 }, { scale: 1.5, duration: 1.4, ease: "expo.out", immediateRender: false }, PRESS + 0.1);
          tl.fromTo("#ripple", { opacity: 0.65 }, { opacity: 0, duration: 1.4, ease: "power2.out", immediateRender: false }, PRESS + 0.1);

          window.__timelines["lockup"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
