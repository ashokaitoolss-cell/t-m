# Publishes everything under sites/ to GitHub Pages:
#   https://ashokaitoolss-cell.github.io/t-m/              landing page
#   https://ashokaitoolss-cell.github.io/t-m/splat-window/
#   https://ashokaitoolss-cell.github.io/t-m/backrooms/
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Pushes to the default branch that touch a site deploy it; on other
# branches the job is skipped. It can also be run by hand from the Actions tab.
name: Deploy sites to Pages

on:
  push:
    paths:
      - 'sites/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running one finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: sites
      - id: deployment
        uses: actions/deploy-pages@v5
