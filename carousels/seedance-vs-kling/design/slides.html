<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* ── Design tokens ─────────────────────────────────────────────── */
  :root {
    --bg: #0E0F13;          /* ink base, constant across the series */
    --panel: #16181E;       /* raised cards */
    --line: #2A2D36;
    --text: #F1EEE7;        /* warm off-white for body */
    --muted: #8D909B;
    --a: #FF9A7A;           /* Seedance accent: coral */
    --b: #9BF2D2;           /* Kling accent: mint */
    --hl: var(--b);         /* headline colour for this post */
    --gutter: 60px;
  }
  @font-face { font-family: "Display"; src: local("Inter Display Bold"), local("InterDisplay-Bold"); font-weight: 700; }
  @font-face { font-family: "Display"; src: local("Inter Display Medium"), local("InterDisplay-Medium"); font-weight: 500; }
  @font-face { font-family: "Display"; src: local("Inter Display SemiBold"), local("InterDisplay-SemiBold"); font-weight: 600; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body { font-family: "Display", "Inter", sans-serif; color: var(--text); }

  #strip { display: flex; width: max-content; position: relative; }
  .slide { width: 1080px; height: 1350px; position: relative; overflow: hidden; background: var(--bg); flex: none; }

  /* ── Type ──────────────────────────────────────────────────────── */
  .h1 { font-weight: 700; font-size: 76px; line-height: .98; letter-spacing: -0.055em; color: var(--hl); }
  .h2 { font-weight: 700; font-size: 58px; line-height: 1; letter-spacing: -0.05em; color: var(--hl); }
  .sub { font-weight: 500; font-size: 32px; line-height: 1.38; letter-spacing: -0.035em; color: var(--hl); }
  .body { font-weight: 500; font-size: 28px; line-height: 1.35; letter-spacing: -0.03em; color: var(--text); }
  .kicker { font-weight: 600; font-size: 22px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 22px; letter-spacing: 0.08em;
          text-transform: uppercase; padding: 10px 16px; border-radius: 999px; background: rgba(14,15,19,.82); backdrop-filter: blur(6px); }
  .chip i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .chip.a { color: var(--a); } .chip.a i { background: var(--a); }
  .chip.b { color: var(--b); } .chip.b i { background: var(--b); }

  /* ── Media frames (placeholders until real stills land) ────────── */
  .frame { position: absolute; background: #222; overflow: hidden; }
  .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .frame.ph { display: flex; align-items: center; justify-content: center; }
  .frame.ph.peek::after { content: none; }
  .frame.ph::after { content: attr(data-label); font-weight: 600; font-size: 22px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.45); }
  .frame.ph.a { background: radial-gradient(120% 80% at 30% 70%, #6b3326 0%, #2a1712 55%, #120c0b 100%); }
  .frame.ph.b { background: radial-gradient(120% 80% at 70% 30%, #1e5a49 0%, #0f2a23 55%, #08120f 100%); }
  .frame .tag { position: absolute; left: 20px; top: 20px; }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: .16; mix-blend-mode: overlay;
           background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  .arrow { position: absolute; width: 150px; height: 210px; color: var(--hl); }
  .page { position: absolute; right: var(--gutter); bottom: 44px; font-weight: 600; font-size: 20px; letter-spacing: .1em; color: var(--muted); }
  .handle { position: absolute; left: var(--gutter); bottom: 44px; font-weight: 600; font-size: 20px; letter-spacing: .02em; color: var(--muted); }

  /* score dots */
  .dots { display: inline-flex; gap: 8px; }
  .dots b { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; display: block; }
  .dots b.on { background: currentColor; }
</style>
</head>
<body>
<div id="strip"></div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>
    <symbol id="loop-arrow" viewBox="0 0 150 210">
      <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)">
        <path d="M98 6 C 96 40, 104 66, 92 92 C 78 120, 26 118, 24 92 C 22 66, 72 62, 100 86 C 128 112, 112 160, 20 196"/>
        <path d="M20 196 L 58 194 M20 196 L 40 166"/>
      </g>
    </symbol>
  </defs>
</svg>

<script src="content.js"></script>
<script>
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const M = window.CAROUSEL;
document.documentElement.style.setProperty('--hl', M.headlineColor === 'a' ? 'var(--a)' : 'var(--b)');
const model = (k) => M.models[k];

function frame(k, src, style, extra = '') {
  const m = model(k.split(" ")[0]);
  const inner = src ? `<img src="${src}">` : '';
  return `<div class="frame ${src ? '' : 'ph'} ${k}" data-label="${esc(m.name)} still" style="${style}">${inner}<div class="grain"></div>${extra}</div>`;
}
const chip = (k) => `<span class="chip ${k}"><i></i>${esc(model(k).name)}</span>`;
const dots = (n, k) => `<span class="dots" style="color:var(--${k})">${[1,2,3,4,5].map(i => `<b class="${i <= n ? 'on' : ''}"></b>`).join('')}</span>`;
const arrow = (style) => `<svg class="arrow" style="${style}"><use href="#loop-arrow"/></svg>`;
const total = M.slides.length;
const foot = (i) => `<div class="handle">${esc(M.handle)}</div><div class="page">${String(i + 1).padStart(2, '0')} / ${String(total).padStart(2, '0')}</div>`;

const R = {
  // Even split: each model gets a full-height half, labelled; hook sits across both on a fade.
  cover: (s, i) => `<section class="slide">
      ${frame('a', s.a, 'left:0;top:0;width:537px;height:1350px', `<div class="tag">${chip('a')}</div>`)}
      ${frame('b', s.b, 'left:543px;top:0;width:537px;height:1350px', `<div class="tag" style="left:auto;right:20px">${chip('b')}</div>`)}
      <div style="position:absolute;left:0;right:0;bottom:0;height:620px;background:linear-gradient(to bottom, rgba(14,15,19,0) 0%, rgba(14,15,19,.82) 45%, var(--bg) 100%)"></div>
      <div class="kicker" style="position:absolute;left:var(--gutter);top:840px;color:var(--text)">${esc(s.kicker)}</div>
      <div class="h1" style="position:absolute;left:var(--gutter);top:892px;width:800px;font-size:92px">${s.title}</div>
      <div class="sub" style="position:absolute;left:var(--gutter);top:1100px;width:700px">${s.sub}</div>
      ${arrow('right:90px;top:1010px;width:120px;height:168px')}
    </section>`,

  // The test card: prompt + identical settings for both models.
  setup: (s, i) => `<section class="slide">
      <div style="position:absolute;left:var(--gutter);top:110px;right:var(--gutter)">
        <div class="kicker">${esc(s.kicker)}</div>
        <div class="h2" style="margin-top:22px;max-width:860px">${s.title}</div>
        <div style="margin-top:56px;background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:40px 44px">
          <div class="kicker" style="margin-bottom:18px">Same input, same settings, both models</div>
          ${s.prompts.map((p, j) => `<div class="body" style="padding:22px 0;${j ? 'border-top:1px solid var(--line)' : ''}"><span style="color:var(--muted)">0${j + 1}</span>&nbsp;&nbsp;${esc(p)}</div>`).join('')}
        </div>
        <div style="margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:20px">
          ${['a','b'].map(k => `<div style="border:1px solid var(--line);border-radius:24px;padding:28px 32px">
            ${chip(k)}
            <div class="body" style="margin-top:18px;color:var(--muted);font-size:24px">${model(k).settings.map(esc).join('<br>')}</div></div>`).join('')}
        </div>
      </div>
      ${foot(i)}
    </section>`,

  // Side-by-side result: two 9:16 stills, labelled, prompt line on top.
  result: (s, i) => `<section class="slide">
      <div style="position:absolute;left:var(--gutter);top:84px;right:var(--gutter)">
        <div class="kicker">${esc(s.kicker)}</div>
        <div class="h2" style="margin-top:16px;font-size:52px">${s.title}</div>
      </div>
      ${frame('a', s.a, 'left:40px;top:300px;width:490px;height:871px;border-radius:22px', `<div class="tag">${chip('a')}</div>`)}
      ${frame('b', s.b, 'left:550px;top:300px;width:490px;height:871px;border-radius:22px', `<div class="tag">${chip('b')}</div>`)}
      <div class="body" style="position:absolute;left:var(--gutter);right:var(--gutter);top:1196px;color:var(--muted);font-size:24px">${esc(s.caption)}</div>
      ${foot(i)}
    </section>`,

  // Notes: motion / visual / prompt, one short line each per model, 5-dot score.
  notes: (s, i) => `<section class="slide">
      <div style="position:absolute;left:var(--gutter);top:110px;right:var(--gutter)">
        <div class="kicker">${esc(s.kicker)}</div>
        <div class="h2" style="margin-top:22px;max-width:900px">${s.title}</div>
        <div style="margin-top:54px">
          ${s.rows.map((r, j) => `<div style="padding:30px 0;${j ? 'border-top:1px solid var(--line)' : ''}">
              <div class="kicker" style="color:var(--text);margin-bottom:20px">${esc(r.label)}</div>
              ${['a','b'].map(k => `<div style="display:grid;grid-template-columns:200px 1fr 130px;align-items:center;gap:20px;margin-top:12px">
                  <span class="chip ${k}" style="background:none;padding:0"><i></i>${esc(model(k).short)}</span>
                  <span class="body" style="font-size:26px">${esc(r[k].note)}</span>
                  ${dots(r[k].score, k)}</div>`).join('')}
            </div>`).join('')}
        </div>
      </div>
      ${foot(i)}
    </section>`,

  // Scoreboard across all rounds.
  score: (s, i) => `<section class="slide">
      <div style="position:absolute;left:var(--gutter);top:110px;right:var(--gutter)">
        <div class="kicker">${esc(s.kicker)}</div>
        <div class="h2" style="margin-top:22px">${s.title}</div>
        <div style="margin-top:60px;border:1px solid var(--line);border-radius:28px;overflow:hidden">
          <div style="display:grid;grid-template-columns:1fr 210px 210px;padding:26px 36px;background:var(--panel)">
            <span class="kicker">Category</span>${chip('a').replace('chip a','chip a" style="background:none;padding:0')}${chip('b').replace('chip b','chip b" style="background:none;padding:0')}
          </div>
          ${s.rows.map(r => `<div style="display:grid;grid-template-columns:1fr 210px 210px;padding:30px 36px;border-top:1px solid var(--line);align-items:center">
              <span class="body">${esc(r.label)}</span>
              <span class="h2" style="font-size:44px;color:var(--a)">${esc(r.a)}</span>
              <span class="h2" style="font-size:44px;color:var(--b)">${esc(r.b)}</span></div>`).join('')}
        </div>
      </div>
      ${foot(i)}
    </section>`,

  // Takeaway + CTA, mirrors the reference caption's "Comment KEYWORD" close.
  takeaway: (s, i) => `<section class="slide">
      <div style="position:absolute;left:var(--gutter);top:140px;right:var(--gutter)">
        <div class="kicker">${esc(s.kicker)}</div>
        <div class="h1" style="margin-top:26px;max-width:900px">${s.title}</div>
        <div style="margin-top:60px;display:grid;gap:22px">
          ${['a','b'].map(k => `<div style="border:1px solid var(--line);border-radius:26px;padding:32px 36px">
              ${chip(k)}<div class="body" style="margin-top:16px">${esc(s[k])}</div></div>`).join('')}
        </div>
      </div>
      ${arrow('left:var(--gutter);top:1010px;width:110px;height:154px')}
      <div class="sub" style="position:absolute;left:200px;top:1060px;right:var(--gutter)">${s.cta}</div>
      ${foot(i)}
    </section>`,
};

const strip = document.getElementById('strip');
M.slides.forEach((s, i) => strip.appendChild($(R[s.type](s, i))));
window.SLIDE_COUNT = M.slides.length;
</script>
</body>
</html>
